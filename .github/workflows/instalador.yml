# Gera o instalador Windows do K7Cabines PDV na esteira do GitHub.
#
# Dispara ao publicar uma tag `v*` (ex.: v0.2.0) ou manualmente em Actions.
# O .exe (NSIS) e o .msi ficam como artefato do run e, em tag, numa Release
# rascunho com o nome da tag.
name: Instalador

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    name: Windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # O package-lock foi gerado no macOS e não traz os binários nativos do
      # Windows (Tauri CLI, lightningcss, rollup...). Bug conhecido do npm com
      # optionalDependencies: a saída é resolver a árvore de novo no Windows.
      - name: Instalar dependências JS (resolvendo no Windows)
        shell: pwsh
        run: |
          Remove-Item -Force package-lock.json
          npm install --no-package-lock --no-audit --no-fund --legacy-peer-deps

      # A release vai para OUTRO repositório, e o GitHub exige que a tag exista
      # lá (o commit daqui não existe lá). Cria a tag no último commit do
      # repositório público; se já existir, segue.
      - name: Criar a tag no repositório público de releases
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $sha = gh api repos/mesquitadev/k7cabines-releases/commits/HEAD --jq .sha
          gh api -X POST repos/mesquitadev/k7cabines-releases/git/refs -f ref="refs/tags/${{ github.ref_name }}" -f sha=$sha
          if ($LASTEXITCODE -ne 0) { Write-Host "Tag já existe; seguindo." }
          exit 0

      # Empacota, assina o pacote de atualização com a chave privada (secret) e
      # publica no repositório PÚBLICO de releases, de onde o app instalado
      # baixa o latest.json e o .exe assinado. O código continua privado.
      - name: Empacotar, assinar e publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_INCREMENTAL: 0
        with:
          owner: mesquitadev
          repo: k7cabines-releases
          tagName: ${{ github.ref_name }}
          releaseName: "K7Cabines PDV ${{ github.ref_name }}"
          releaseBody: "Instalação nova: baixe o .exe. Quem já tem o sistema recebe o aviso de atualização ao abrir."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis

      - name: Guardar instaladores como artefato
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
