# Gera o instalador Windows do K7Cabines PDV na esteira do GitHub.
#
# Dispara ao publicar uma tag `v*` (ex.: v0.2.0) ou manualmente em Actions.
# O .exe (NSIS) e o .msi ficam como artefato do run e, em tag, numa Release
# rascunho com o nome da tag.
name: Instalador

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    name: Windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências JS
        run: npm ci

      - name: Empacotar (NSIS + MSI)
        run: npm run desktop:build:windows
        env:
          CARGO_INCREMENTAL: 0

      - name: Guardar instaladores como artefato
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publicar na Release (rascunho)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "K7Cabines PDV ${{ github.ref_name }}"
          body: "Instaladores gerados pela esteira. Confira em uma máquina limpa antes de entregar."
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
