# Gera os instaladores do K7Cabines PDV em cada sistema, na esteira do GitHub.
#
# Dispara ao publicar uma tag `v*` (ex.: v0.2.0) ou manualmente em Actions.
# Cada sistema empacota no seu próprio runner — o Tauri não faz build cruzada.
# Os arquivos vão para uma Release com o nome da tag, como rascunho, para
# conferir antes de entregar à loja.
name: Instalador

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  empacotar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: Windows
            bundles: nsis,msi
          # macOS e Linux ficam de fora por ora: o macOS é gerado localmente.
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.nome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências JS
        run: npm ci

      - name: Verificar (testes Rust, clippy, tsc)
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          npx tsc --noEmit

      - name: Empacotar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assinatura Windows: defina TAURI_WINDOWS_SIGN_COMMAND nos secrets quando houver certificado.
          # Assinatura macOS: APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID.
        with:
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "K7Cabines PDV ${{ github.ref_name }}"
          releaseBody: "Instaladores gerados pela esteira. Confira em uma máquina limpa antes de entregar."
          releaseDraft: true
          prerelease: false

      - name: Guardar instaladores como artefato
        uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.nome }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
